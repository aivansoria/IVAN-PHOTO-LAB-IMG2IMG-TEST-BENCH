name: Catastro page 6 validation

on:
  push:
    branches:
      - catastro-page5-validation-20260728
  pull_request:
    branches:
      - main
    paths:
      - "catastro_page6/**"
      - ".github/workflows/catastro-page5-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Validate Campo Cercano page 6
        run: python catastro_page6/validate_page6.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catastro-page6-results
          path: catastro_page6/results/
          if-no-files-found: error
          retention-days: 7
