name: Download temporary Whisper VAD model

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  download-vad-model:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download Silero VAD model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bundle
          curl --retry 5 --retry-delay 2 -L --fail \
            https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin \
            -o bundle/ggml-silero-v6.2.0.bin
          sha256sum bundle/ggml-silero-v6.2.0.bin | tee bundle/SHA256SUMS_VAD.txt

      - name: Upload VAD model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-vad-silero-v6.2.0
          path: bundle/
          retention-days: 1
          compression-level: 0
