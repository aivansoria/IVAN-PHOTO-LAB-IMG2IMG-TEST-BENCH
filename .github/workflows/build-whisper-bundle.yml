name: Download temporary RNNoise models

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  collect-rnnoise-models:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Collect RNNoise model files
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/GregorR/rnnoise-models.git source
          mkdir -p bundle
          find source -type f \( -name '*.rnnn' -o -name '*.model' -o -name 'weights_blob.bin' \) -print
          find source -type f \( -name '*.rnnn' -o -name '*.model' -o -name 'weights_blob.bin' \) -exec cp --parents '{}' bundle/ \;
          find bundle -type f -exec sha256sum '{}' \; | tee bundle/SHA256SUMS.txt

      - name: Upload RNNoise models
        uses: actions/upload-artifact@v4
        with:
          name: rnnoise-models
          path: bundle/
          retention-days: 1
          compression-level: 0
