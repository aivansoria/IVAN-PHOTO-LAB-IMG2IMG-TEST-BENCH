name: Download temporary Whisper Large-v3 Turbo model

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  download-whisper-turbo:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Download multilingual Large-v3 Turbo Q5 model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bundle
          curl --retry 5 --retry-delay 2 -L --fail \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin \
            -o bundle/ggml-large-v3-turbo-q5_0.bin
          sha256sum bundle/ggml-large-v3-turbo-q5_0.bin | tee bundle/SHA256SUMS_TURBO.txt

      - name: Upload Turbo model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-large-v3-turbo-q5_0
          path: bundle/
          retention-days: 1
          compression-level: 0
