name: Download temporary MetricGAN voice enhancement model

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  collect-metricgan:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Download SpeechBrain MetricGAN+ model
        shell: bash
        run: |
          set -euxo pipefail
          git lfs install
          git clone --depth 1 https://huggingface.co/speechbrain/metricgan-plus-voicebank model
          cd model
          git lfs pull
          cd ..
          rm -rf model/.git
          find model -type f -exec sha256sum '{}' \; | tee model/SHA256SUMS.txt

      - name: Upload MetricGAN model
        uses: actions/upload-artifact@v4
        with:
          name: speechbrain-metricgan-plus-voicebank
          path: model/
          retention-days: 1
          compression-level: 0
