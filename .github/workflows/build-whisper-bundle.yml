name: Download temporary Spanish Wav2Vec2 model

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  download-spanish-wav2vec2:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Download VoxPopuli Spanish ASR model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bundle
          curl --retry 5 --retry-delay 2 -L --fail \
            https://download.pytorch.org/torchaudio/models/wav2vec2_voxpopuli_base_10k_asr_es.pt \
            -o bundle/wav2vec2_voxpopuli_base_10k_asr_es.pt
          sha256sum bundle/wav2vec2_voxpopuli_base_10k_asr_es.pt | tee bundle/SHA256SUMS.txt

      - name: Upload Spanish ASR model
        uses: actions/upload-artifact@v4
        with:
          name: wav2vec2-voxpopuli-es
          path: bundle/
          retention-days: 1
          compression-level: 0
