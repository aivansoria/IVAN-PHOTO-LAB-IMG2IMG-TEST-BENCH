name: Catastro Page 8 Resolve
on:
  pull_request:
  workflow_dispatch:
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Directed second pass
        run: |
          cat > /tmp/query.py <<'PY'
          import csv,json,time,urllib.parse,urllib.request,xml.etree.ElementTree as ET
          def get(url):
            last=None
            for attempt in range(3):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 CatastroValidation/3.0','Accept':'application/xml,text/xml,*/*'})
                return urllib.request.urlopen(req,timeout=35).read()
              except Exception as e: last=e; time.sleep(.7*(attempt+1))
            raise last
          def ln(tag): return tag.split('}')[-1].lower()
          def first(root,names):
            for n in root.iter():
              if ln(n.tag) in names and (n.text or '').strip(): return (n.text or '').strip()
            return ''
          def query(pol,par):
            url='https://ovc.catastro.meh.es/ovcservweb/OVCSWLocalizacionRC/OVCCallejero.asmx/Consulta_DNPPP?'+urllib.parse.urlencode({'Provincia':'SORIA','Municipio':'DEZA','Poligono':pol,'Parcela':par})
            try: root=ET.fromstring(get(url))
            except Exception as e: return {'state':'ERROR','polygon':pol,'parcel':par,'error':str(e)}
            pc1=first(root,{'pc1'});pc2=first(root,{'pc2'});car=first(root,{'car'})
            if not pc1 or not pc2:return {'state':'NO_LOCALIZADA','polygon':pol,'parcel':par}
            ref=pc1+pc2;area=None
            au='https://ovc.catastro.meh.es/INSPIRE/wfsCP.aspx?'+urllib.parse.urlencode({'service':'WFS','version':'2.0.0','request':'GetFeature','STOREDQUERIE_ID':'GetParcel','refcat':ref,'srsname':'EPSG::25830'})
            try:
              ar=ET.fromstring(get(au));vals=[]
              for n in ar.iter():
                if ln(n.tag) in {'areavalue','area'}:
                  try:vals.append(float((n.text or '').strip()))
                  except:pass
              if vals:
                v=max(vals);area=v/10000 if v>100 else v
            except:pass
            return {'state':'VALIDADA','polygon':pol,'parcel':par,'official_place':first(root,{'npa','ldt','ldt1','paraje'}),'area_ha':round(area,4) if area is not None else None,'parcel_reference':ref,'full_reference':ref+car,'map_url':'https://www1.sedecatastro.gob.es/Cartografia/BuscarParcelaInternet.aspx?refcat='+ref,'record_url':'https://www1.sedecatastro.gob.es/CYCBienInmueble/OVCListaBienes.aspx?RC1='+ref[:7]+'&RC2='+ref[7:14]}
          direct_specs={
            'azanon':[(22,15664),(22,25664),(22,5564),(22,5764)],
            'frente_azanon':[(24,15600),(24,25600),(24,5500),(24,5700)],
            'dehesa_pol28':[(28,25667),(28,15667),(28,5667),(28,5666),(28,5675),(28,5676)],
            'puente':[(11,5155)],
            'melonar':[(22,5385),(22,15385),(22,25385)]
          }
          direct={}
          for name,specs in direct_specs.items():
            direct[name]=[]
            for p,q in specs:
              direct[name].append(query(p,q));time.sleep(.3)
          scan=[]
          for par in range(5700,5800):
            r=query(28,par)
            if r.get('state')=='VALIDADA':
              place=(r.get('official_place') or '').upper()
              area=r.get('area_ha')
              if 'LUNAR' in place or (area is not None and min(abs(area-x) for x in (.65,.85,.90))<=.12):scan.append(r)
            time.sleep(.12)
          payload={'direct':direct,'barranco_lunar_scan_5700_5799':scan}
          json.dump(payload,open('catastro_page8_resolution.json','w'),ensure_ascii=False,indent=2)
          with open('catastro_page8_resolution.csv','w',encoding='utf-8-sig',newline='') as f:
            w=csv.writer(f,delimiter=';');w.writerow(['Grupo','Poligono','Parcela','Estado','Paraje','Ha','Referencia','URL_mapa'])
            for name,items in direct.items():
              for r in items:w.writerow([name,r.get('polygon'),r.get('parcel'),r.get('state'),r.get('official_place',''),r.get('area_ha',''),r.get('parcel_reference',''),r.get('map_url','')])
            for r in scan:w.writerow(['barranco_lunar_scan',r.get('polygon'),r.get('parcel'),r.get('state'),r.get('official_place',''),r.get('area_ha',''),r.get('parcel_reference',''),r.get('map_url','')])
          print(json.dumps({'direct_valid':sum(r.get('state')=='VALIDADA' for items in direct.values() for r in items),'scan_matches':len(scan)},ensure_ascii=False))
          PY
          python /tmp/query.py
      - uses: actions/upload-artifact@v4
        with:
          name: catastro-page8-resolution
          path: |
            catastro_page8_resolution.json
            catastro_page8_resolution.csv
